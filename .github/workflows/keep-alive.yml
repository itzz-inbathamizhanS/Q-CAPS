# Keeps the hosted API awake on Render's free plan (it sleeps after 15 minutes idle) and,
# because /api/content/tracks reads the database, keeps the Supabase project from pausing.
# One run loops for up to ~5.8 hours, pinging every 5 minutes until KEEP_ALIVE_UNTIL (UTC).
# The hourly schedule only restarts the loop if no run is active. Disable it in the Actions tab to stop sooner.
name: Keep alive

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      KEEP_ALIVE_UNTIL: "2026-10-31T18:30:00Z"  # midnight India time
    steps:
      - name: Ping API (and database) and scanner every 5 minutes
        run: |
          until_ts=$(date -u -d "$KEEP_ALIVE_UNTIL" +%s)
          stop_ts=$(( $(date -u +%s) + 340*60 ))
          while [ "$(date -u +%s)" -lt "$until_ts" ] && [ "$(date -u +%s)" -lt "$stop_ts" ]; do
            api=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://qcaps-api.onrender.com/api/content/tracks) || true
            # There is no GET route on the scanner; any response (404 on /) means the instance is awake.
            scanner=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://qcaps-scanner.onrender.com/) || true
            echo "$(date -u +%H:%M) api=$api scanner=$scanner"
            sleep 300
          done
          echo "Window over or run limit reached"
