# Keeps the hosted API awake on Render's free plan (it sleeps after 15 minutes idle) and,
# because /api/content/tracks reads the database, keeps the Supabase project from pausing.
# Runs only until KEEP_ALIVE_UNTIL (UTC); after that every run exits immediately. Disable it in the Actions tab to stop sooner.
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      KEEP_ALIVE_UNTIL: "2026-10-31T18:30:00Z"  # midnight India time
    steps:
      - name: Check window
        id: window
        run: |
          if [ "$(date -u +%s)" -lt "$(date -u -d "$KEEP_ALIVE_UNTIL" +%s)" ]; then echo "on=true" >> "$GITHUB_OUTPUT"; else echo "Window over"; fi
      - name: Ping API (and database)
        if: steps.window.outputs.on == 'true'
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 90 https://qcaps-api.onrender.com/api/content/tracks) || true
            echo "api: $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
      - name: Ping scanner
        if: steps.window.outputs.on == 'true'
        # There is no GET route on the scanner; any response (404 on /) means the instance is awake.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 120 https://qcaps-scanner.onrender.com/) || true
          echo "scanner: $code"
          [ "$code" != "000" ]
