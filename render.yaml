# Render blueprint for the API (free plan). The frontend is deployed on Vercel from the frontend/ folder.
# Set QCAPS_CORS_ORIGINS to the Vercel URL and the three passwords in the Render dashboard (they are not in git).
services:
  - type: web
    name: qcaps-api
    runtime: python
    plan: free
    rootDir: backend/main_api
    buildCommand: pip install -r requirements.txt && python deploy_bootstrap.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: QCAPS_ENV
        value: production
      - key: QCAPS_DATABASE_URL
        value: sqlite:///./qcaps.db
      - key: QCAPS_JWT_SECRET
        generateValue: true
      - key: QCAPS_CORS_ORIGINS
        sync: false
      - key: QCAPS_ADMIN_PASSWORD
        sync: false
      - key: QCAPS_DEMO_LEARNER_PASSWORD
        sync: false
      - key: QCAPS_DEMO_COMPLETE_PASSWORD
        sync: false

  # Crypto scanner (Flask). The frontend reaches it through VITE_SCANNER_API_URL, set on Vercel to this service's URL.
  # QCAPS_JWT_SECRET must equal the API's value: the scanner validates the API's tokens and signs scan receipts the API
  # verifies. One worker keeps the per-user lock and rate limiter in a single process (see docs/architecture/SCANNER.md).
  - type: web
    name: qcaps-scanner
    runtime: python
    plan: free
    rootDir: backend/scanner_api
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: QCAPS_JWT_SECRET
        fromService:
          type: web
          name: qcaps-api
          envVarKey: QCAPS_JWT_SECRET
      - key: QCAPS_CORS_ORIGINS
        sync: false
